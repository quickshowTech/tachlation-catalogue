<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
<title>QUICK SHOW — Melbourne Expo Catalogue 2026</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;font-family:system-ui,-apple-system,sans-serif;color:#fff}
.header{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(17,17,17,.95);backdrop-filter:blur(10px);border-bottom:1px solid #2a2a2a}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:32px;height:32px;background:#fff;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;color:#111}
.brand h1{font-size:14px;font-weight:700}
.brand .sub{font-size:11px;color:#888}
.pages{max-width:800px;margin:0 auto}
.pg{position:relative;background:#1a1a1a;margin-bottom:1px}
.pg img{display:block;width:100%;height:auto}
.pn{position:absolute;bottom:6px;right:8px;padding:2px 8px;border-radius:5px;background:rgba(0,0,0,.65);font-size:10px;color:#999;pointer-events:none}
.foot{text-align:center;padding:20px 16px 40px;color:#555;font-size:11px}
</style>
</head>
<body>
<div class="header">
<div class="brand">
<div class="logo">QS</div>
<div><h1>QUICK SHOW®</h1><div class="sub">Melbourne Expo 2026</div></div>
</div>
</div>
<div class="pages" id="p"></div>
<div class="foot">QUICK SHOW® Melbourne Expo Catalogue 2026 · 42 Pages</div>
<script>
var T=42,c=document.getElementById('p');
for(var i=1;i<=T;i++){
var d=document.createElement('div');d.className='pg';
var img=document.createElement('img');
img.alt='Page '+i;
img.decoding='async';
img.src='pages/p'+(i<10?'0':'')+i+'.jpg';
if(i>3)img.loading='lazy';
img.width=595;img.height=842;
d.appendChild(img);
var n=document.createElement('div');n.className='pn';n.textContent=i+'/'+T;
d.appendChild(n);
c.appendChild(d);
}
</script>
</body>
</html>
