<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0">
<title>QUICK SHOW — Melbourne Expo Catalogue 2026</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;font-family:system-ui,-apple-system,sans-serif;color:#fff;overflow-x:hidden}
.header{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(17,17,17,0.92);backdrop-filter:blur(12px);border-bottom:1px solid #2a2a2a}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:32px;height:32px;background:#fff;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:900;color:#111;letter-spacing:.5px;line-height:1}
.brand h1{font-size:14px;font-weight:700;letter-spacing:.3px}
.brand .sub{font-size:11px;color:#888;margin-top:1px}
.dl-btn{padding:7px 14px;border-radius:8px;background:#3b82f6;color:#fff;text-decoration:none;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.pages{max-width:800px;margin:0 auto;padding:8px 0}
.page-item{margin-bottom:2px;position:relative;background:#1a1a1a}
.page-item img{display:block;width:100%;height:auto}
.page-num{position:absolute;bottom:8px;right:8px;padding:3px 10px;border-radius:6px;background:rgba(0,0,0,0.7);font-size:11px;color:#aaa;pointer-events:none}
.loading-placeholder{width:100%;aspect-ratio:0.707;background:#1a1a1a;display:flex;align-items:center;justify-content:center}
.loading-placeholder::after{content:'';width:24px;height:24px;border:2px solid #333;border-top-color:#3b82f6;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{text-align:center;padding:24px 16px 40px;color:#555;font-size:12px}
</style>
</head>
<body>
<div class="header">
<div class="brand">
<div class="logo">QS</div>
<div><h1>QUICK SHOW®</h1><div class="sub">Melbourne Expo 2026</div></div>
</div>
<a href="catalogue.pdf" download class="dl-btn">⬇ PDF</a>
</div>
<div class="pages" id="pages"></div>
<div class="footer">QUICK SHOW® Melbourne Expo Catalogue 2026 · 42 Pages</div>
<script>
const TOTAL=42;
const container=document.getElementById('pages');
for(let i=1;i<=TOTAL;i++){
  const div=document.createElement('div');
  div.className='page-item';
  const placeholder=document.createElement('div');
  placeholder.className='loading-placeholder';
  div.appendChild(placeholder);
  const num=document.createElement('div');
  num.className='page-num';
  num.textContent=i+' / '+TOTAL;
  div.appendChild(num);
  const img=new Image();
  img.alt='Page '+i;
  img.loading='lazy';
  img.decoding='async';
  img.src='pages/p'+(i<10?'0':'')+i+'.jpg';
  img.onload=function(){placeholder.replaceWith(img)};
  container.appendChild(div);
}
</script>
</body>
</html>
