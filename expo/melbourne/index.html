<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUICK SHOW — Melbourne Expo Catalogue 2026</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a1a;font-family:system-ui,sans-serif;color:#fff;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:#111;border-bottom:1px solid #333;flex-shrink:0}
.header .brand{display:flex;align-items:center;gap:12px}
.header .logo{width:36px;height:36px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center}
.header .logo svg{width:24px;height:24px}
.header h1{font-size:16px;font-weight:700;letter-spacing:.5px}
.header .sub{font-size:12px;color:#888;margin-top:1px}
.header .actions{display:flex;gap:8px}
.header .btn{padding:8px 16px;border-radius:8px;border:1px solid #444;background:#222;color:#fff;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:background .2s}
.header .btn:hover{background:#333}
.header .btn.primary{background:#3b82f6;border-color:#3b82f6}
.header .btn.primary:hover{background:#2563eb}
.pdf-container{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.pdf-container iframe,.pdf-container embed,.pdf-container object{width:100%;height:100%;border:none}
/* Fallback for mobile / browsers that don't embed PDF */
.fallback{display:none;text-align:center;padding:40px 20px}
.fallback p{margin-bottom:20px;color:#aaa;font-size:15px}
.fallback .dl-btn{display:inline-block;padding:14px 32px;background:#3b82f6;color:#fff;border-radius:10px;text-decoration:none;font-weight:600;font-size:16px}
.fallback .dl-btn:hover{background:#2563eb}
@media(max-width:768px){
  .pdf-container iframe,.pdf-container embed,.pdf-container object{display:none}
  .fallback{display:block}
}
</style>
</head>
<body>
<div class="header">
  <div class="brand">
    <div class="logo">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="30" cy="30" r="12" fill="#1a1a2e"/>
        <circle cx="70" cy="30" r="12" fill="#1a1a2e"/>
        <circle cx="30" cy="70" r="12" fill="#1a1a2e"/>
        <circle cx="70" cy="70" r="12" fill="#1a1a2e"/>
        <rect x="25" y="42" width="10" height="16" rx="5" fill="#1a1a2e"/>
        <rect x="65" y="42" width="10" height="16" rx="5" fill="#1a1a2e"/>
        <rect x="42" y="25" width="16" height="10" rx="5" fill="#1a1a2e"/>
        <rect x="42" y="65" width="16" height="10" rx="5" fill="#1a1a2e"/>
      </svg>
    </div>
    <div>
      <h1>QUICK SHOW®</h1>
      <div class="sub">Melbourne Expo Catalogue 2026</div>
    </div>
  </div>
  <div class="actions">
    <a href="catalogue.pdf" download class="btn primary">⬇ Download PDF</a>
  </div>
</div>
<div class="pdf-container">
  <iframe src="catalogue.pdf" type="application/pdf"></iframe>
  <div class="fallback">
    <p>PDF 预览在移动端可能不可用，请点击下方按钮下载查看</p>
    <a href="catalogue.pdf" download class="dl-btn">⬇ 下载 PDF</a>
  </div>
</div>
</body>
</html>
